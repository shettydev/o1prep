name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Python backend lives in backend/ since the monorepo split.
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: o1prep
          POSTGRES_PASSWORD: o1prep
          POSTGRES_DB: o1prep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U o1prep -d o1prep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://o1prep:o1prep@localhost:5432/o1prep
      SECRET_KEY: ci-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        # Node powers the JavaScript code runner; without it the JS runner tests
        # skip themselves. Installing it here keeps them exercised in CI.
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest
