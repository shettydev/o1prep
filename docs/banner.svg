<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', 'Courier New', monospace">
  <defs>
    <!-- faint phosphor grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#17140d" stroke-width="1"/>
    </pattern>
    <!-- faint CRT scanlines -->
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.22"/>
    </pattern>
    <!-- amber bloom behind the wordmark -->
    <radialGradient id="bloom" cx="18%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <!-- tight phosphor glow for the hero glyphs only -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="1280" height="280" fill="#0a0a09"/>
  <rect width="1280" height="280" fill="url(#grid)"/>
  <rect width="1280" height="280" fill="url(#bloom)"/>

  <!-- ── middle: the ~O(1) flatline tell (everything spikes; O(1) stays level) ── -->
  <g>
    <path d="M452 196 C 520 196, 560 120, 690 96" fill="none" stroke="#ffb000" stroke-width="2" opacity="0.13"/>
    <path d="M452 196 C 540 196, 600 150, 700 130" fill="none" stroke="#ffb000" stroke-width="2" opacity="0.13"/>
    <rect x="446" y="151" width="9" height="12" fill="#ffb000" opacity="0.7"/>
    <line x1="455" y1="157" x2="678" y2="157" stroke="#ffb000" stroke-width="2" opacity="0.7"/>
    <text x="686" y="162" font-size="15" fill="#8a8270">O(1)</text>
  </g>

  <!-- ── left: the hero wordmark ── -->
  <text x="70" y="142" font-size="104" font-weight="700" fill="#ffb000" filter="url(#glow)" letter-spacing="1">O(1)</text>
  <rect x="306" y="66" width="32" height="76" fill="#ffb000" filter="url(#glow)"/>
  <text x="76" y="188" font-size="34" font-weight="600" fill="#b07a00" letter-spacing="4">prep</text>
  <text x="78" y="220" font-size="18" fill="#7c7360" letter-spacing="1">prepare until recall is O(1)</text>

  <!-- ── right: a dimmed faux-terminal panel (texture, not a fake product UI) ── -->
  <g>
    <rect x="800" y="52" width="416" height="176" fill="#0d0c0a" stroke="#3d3830" stroke-width="1"/>
    <!-- title bar -->
    <line x1="800" y1="80" x2="1216" y2="80" stroke="#221e17" stroke-width="1"/>
    <circle cx="818" cy="66" r="4" fill="#46d68a"/>
    <circle cx="834" cy="66" r="4" fill="#ffb000"/>
    <circle cx="850" cy="66" r="4" fill="#ff5d5d"/>
    <text x="1200" y="71" font-size="13" text-anchor="end" fill="#5f5848">session.log</text>
    <!-- boot output -->
    <text x="816" y="112" font-size="14" fill="#9a907a"><tspan fill="#b07a00">&gt; </tspan>establishing session</text>
    <text x="816" y="140" font-size="14" fill="#9a907a"><tspan fill="#b07a00">&gt; </tspan>interviews · problems · ai tutor</text>
    <text x="816" y="168" font-size="14" fill="#9a907a"><tspan fill="#b07a00">&gt; </tspan>recall complexity: <tspan fill="#ffce5c">O(1)</tspan>  <tspan fill="#46d68a">[ok]</tspan></text>
    <text x="816" y="196" font-size="14" fill="#b07a00">&gt; <tspan fill="#5f5848">_</tspan></text>
  </g>

  <!-- CRT scanline overlay on top -->
  <rect width="1280" height="280" fill="url(#scan)"/>
</svg>
